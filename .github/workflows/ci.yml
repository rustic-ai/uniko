name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check, Lint, Format, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: uni-db seal (no raw uni-db in product crates)
        run: |
          # Product crates (memory/extract/cortex/pipes) must reach the graph
          # only through uniko-store's typed API. Forbid `use uni_db` and the
          # `.db()` escape hatch in their src/. Comments are exempt, as are
          # intentional uses tagged `// ALLOW:`. Tests and the bench crate are
          # intentionally out of scope.
          matches=$(rg -n -e 'use uni_db' -e '\.db\(\)' \
            crates/uniko-memory/src crates/uniko-extract/src \
            crates/uniko-cortex/src crates/uniko-pipes/src \
            | grep -vE ':[0-9]+:[[:space:]]*//' \
            | grep -v 'ALLOW:' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::raw uni-db usage found in a sealed product crate (route it through uniko-store)"
            exit 1
          fi
          echo "uni-db seal intact"

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest run
        run: cargo nextest run --workspace

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
