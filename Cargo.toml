[workspace]
resolver = "2"
members = [
    "crates/uniko-store",
    "crates/uniko-pipes",
    "crates/uniko-extract",
    "crates/uniko-memory",
    "crates/uniko-cortex",
    "crates/uniko-api",
    "crates/uniko-bench",
    "bindings/uniko-py",
    # GPU wheel variants — members (for workspace dep inheritance) but excluded
    # from `default-members` below so plain `cargo build`/`check`/`test`/`doc`
    # skip them. They reuse `bindings/uniko-py/src` with a GPU feature; `-metal`
    # only builds on macOS. `--workspace` CI commands must `--exclude` both.
    "bindings/uniko-cuda",
    "bindings/uniko-metal",
]
# Everything except the GPU wheel variants. Keeps default builds host-portable
# (no ORT CUDA sidecar download, no macOS-only CoreML) while still allowing an
# explicit `-p uniko-cuda` / maturin `-m bindings/uniko-cuda/Cargo.toml` build.
default-members = [
    "crates/uniko-store",
    "crates/uniko-pipes",
    "crates/uniko-extract",
    "crates/uniko-memory",
    "crates/uniko-cortex",
    "crates/uniko-api",
    "crates/uniko-bench",
    "bindings/uniko-py",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Dragonscale Industries Inc. <dev@dragonscale.ai>"]
repository = "https://github.com/rustic-ai/uniko"
homepage = "https://www.rustic.ai"
documentation = "https://rustic-ai.github.io/uniko"
keywords = ["memory", "agents", "knowledge-graph", "embeddings", "llm"]
categories = ["database", "text-processing"]

[workspace.dependencies]
# Internal crates (version required so `cargo publish` accepts the path deps)
uniko-store = { path = "crates/uniko-store", version = "0.2.2" }
uniko-pipes = { path = "crates/uniko-pipes", version = "0.2.2" }
uniko-extract = { path = "crates/uniko-extract", version = "0.2.2" }
uniko-memory = { path = "crates/uniko-memory", version = "0.2.2" }
uniko-cortex = { path = "crates/uniko-cortex", version = "0.2.2" }
uniko-api = { path = "crates/uniko-api", version = "0.2.2" }
uniko-bench = { path = "crates/uniko-bench", version = "0.2.2" }

# Database — uni-db default features already include lance-backend,
# provider-onnx (embeddings + NLP + reranker), and every remote provider.
# GPU accelerators (gpu-cuda / gpu-metal) are opt-in via uniko-store /
# uniko-bench passthrough features.
# Tracks the latest 3.x release (^3 = >=3.0.0, <4.0.0); `cargo update -p uni-db`
# refreshes the lockfile to the newest compatible version.
#
# NOTE (2026-06-28): default-features disabled to drop `provider-candle` /
# `provider-mistralrs`. Those pull candle-cuda kernels that nvcc (CUDA 13)
# cannot compile against this host's glibc/gcc-16 — and uniko only names
# `local/mistralrs` as a config string, never via API, so dropping them is
# compile-safe. Trade-off: the local mistralrs LLM provider (LME `gemma-3-4b`
# configs) is unavailable at runtime; LoCoMo uses remote `gpt-4o-mini`, so the
# bge-m3 GPU campaign is unaffected. To restore local LLMs, re-add
# "provider-candle"/"provider-mistralrs" (needs a CUDA-compatible gcc<=15 +
# matching glibc for a GPU build).
uni-db = { version = "3", default-features = false, features = [
    "mimalloc",
    "lance-backend",
    "apoc-core",
    "rhai-plugins",
    "provider-onnx",
    "provider-openai",
    "provider-gemini",
    "provider-vertexai",
    "provider-mistral",
    "provider-anthropic",
    "provider-voyageai",
    "provider-cohere",
    "provider-azure-openai",
] }
# Direct dep on uni-xervo so uniko-store can name `ModelRuntime` in
# `KnowledgeBase::build_shared_runtime` / `open_with_runtime`. uni-db
# uses uni-xervo internally but does not re-export the type. Version
# pinned to whatever uni-db currently depends on (see
# `../uni/Cargo.toml`). uni-db 3.2.0 depends on uni-xervo >=0.17.0, <1.0.0,
# which still resolves to 0.17.0 (the newest published 0.x).
uni-xervo = { version = "0.17.0", default-features = false }
# Tiered PDF extraction (native text -> OCR -> doc-VLM). Pulls only traits +
# the pure-Rust native (lopdf) + rasterizer (hayro) tiers; the inference
# providers ride on `uni-xervo` itself. Built against the same crates.io
# uni-xervo 0.17.0, so the `OcrModel` / `ModelRuntime` types unify.
uni-xervo-pdf = { version = "0.17.0", default-features = false, features = [
    "pdf-input",
    "hayro",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
uuid = { version = "1", features = ["v7"] }

# MIME / content-type taxonomy
mime = "0.3"
mime_guess = "2"
infer = "0.16"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits (object-safe async fn in trait)
async-trait = "0.1"

# Random (retry jitter)
rand = "0.10"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Observability
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Code parsing
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# ML / embedding
ort = "2.0.0-rc.12"
tiktoken-rs = "0.12"
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Python binding
pyo3 = { version = "0.29", features = ["extension-module"] }

# CLI
clap = { version = "4", features = ["derive"] }

# NLP evaluation
rust-stemmers = "1"

# Text processing
regex = "1"

# Caching
lru = "0.18"

# Hashing
sha2 = "0.11"
hex = "0.4"

# Object storage (S3 / R2 / GCS / MinIO / in-memory for tests)
object_store = { version = "0.13", features = ["aws"] }

# Dev dependencies
proptest = "1"

# ── Dev profile: optimize inference-heavy deps so tests don't crawl ──
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3

# ── Release profile: strip symbols from the final artifacts ──
# The linked-in ONNX Runtime (static `provider-onnx`) and the Lance/Arrow/
# DataFusion stack leave ~80 MB of uncompressed symbol/debug data in the
# cdylib; stripping trims ~18 MiB off the compressed wheel. `symbols` drops
# both the symbol table and debuginfo while preserving the dynamic symbols
# (PyInit / abi3 exports) the extension module needs to load. Applies to
# `cargo build --release`, to the `dist` profile below (which inherits it), and
# to the uniko-cuda / uniko-metal variant crates that reuse this workspace.
#
# `panic` is deliberately left at the default (`unwind`): PyO3 catches Rust
# panics at the FFI boundary and re-raises them as Python exceptions, so
# `panic = "abort"` would take the whole interpreter down with the extension
# module. Do not "optimize" it to abort.
[profile.release]
strip = "symbols"

# ── Dist profile: what the published wheels are built with ──
#
# `--release` alone leaves `lto = false` — thin-local LTO *within* each codegen
# unit only — at `codegen-units = 16`, so cross-crate inlining and dead-code
# elimination never run across the ~500 dependency crates statically linked into
# `_uniko.so` (uni-db + Lance/Arrow/DataFusion + ONNX Runtime + tokenizers).
# Whole-graph thin LTO at a single codegen unit lets the linker drop the
# unreachable monomorphizations that dominate that blob.
#
# rustic-ai/uni-db measured the knobs on `uni-python`, the closest comparable
# cdylib (uniko statically contains all of uni-db, so ours is a superset).
# Their baseline row is thin/cgu=16, i.e. already better than a bare
# `--release`; the delta below is therefore a floor, not a ceiling:
#
#   thin, cgu=16   ~368 MiB   -            15m40s
#   thin, cgu=4     289 MiB   11.0 GiB     12m37s
#   thin, cgu=1     238 MiB   11.7 GiB     19m26s   <- LTO/CGU basis
#   fat,  cgu=1     220 MiB   15.8+ GiB    36m48s   <- rejected: OOMs a 14 GB runner
#
# A uniko-py sweep on macOS arm64 found that `opt-level = "z"` reduces the
# stripped thin-LTO dylib from 163.4 MiB (`opt-level = 3`) to 83.1 MiB, yielding
# a 37.7 MiB wheel. Fat LTO reached 71.3 MiB but retains uni-db's CI memory risk,
# so thin LTO remains the publishable-wheel default.
#
# So `codegen-units` is the memory-hungry knob, and peak rustc RSS — not wall
# time — is what actually constrains the choice. Runners too small to hold the
# cgu=1 working set relax it per-job with `CARGO_PROFILE_DIST_CODEGEN_UNITS`
# instead of forking the profile; see `.github/workflows/release.yml`. Note that
# an EMPTY value for that variable is a hard cargo error ("cannot parse integer
# from empty string"), so every job sets a real number.
#
# Named `dist`, not `publish` — Cargo reserves the latter as a profile name.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
