[workspace]
resolver = "2"
members = [
    "crates/uniko-store",
    "crates/uniko-pipes",
    "crates/uniko-extract",
    "crates/uniko-memory",
    "crates/uniko-cortex",
    "crates/uniko-api",
    "crates/uniko-bench",
    "bindings/uniko-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Dragonscale Industries Inc. <dev@dragonscale.ai>"]
repository = "https://github.com/rustic-ai/uniko"
homepage = "https://www.rustic.ai"
documentation = "https://rustic-ai.github.io/uniko"
keywords = ["memory", "agents", "knowledge-graph", "embeddings", "llm"]
categories = ["database", "text-processing"]

[workspace.dependencies]
# Internal crates (version required so `cargo publish` accepts the path deps)
uniko-store = { path = "crates/uniko-store", version = "0.1.0" }
uniko-pipes = { path = "crates/uniko-pipes", version = "0.1.0" }
uniko-extract = { path = "crates/uniko-extract", version = "0.1.0" }
uniko-memory = { path = "crates/uniko-memory", version = "0.1.0" }
uniko-cortex = { path = "crates/uniko-cortex", version = "0.1.0" }
uniko-api = { path = "crates/uniko-api", version = "0.1.0" }
uniko-bench = { path = "crates/uniko-bench", version = "0.1.0" }

# Database — uni-db default features already include lance-backend,
# provider-onnx (embeddings + NLP + reranker), and every remote provider.
# GPU accelerators (gpu-cuda / gpu-metal) are opt-in via uniko-store /
# uniko-bench passthrough features.
uni-db = { version = "2.2.1", features = ["mimalloc"] }
# Direct dep on uni-xervo so uniko-store can name `ModelRuntime` in
# `KnowledgeBase::build_shared_runtime` / `open_with_runtime`. uni-db
# uses uni-xervo internally but does not re-export the type. Version
# pinned to whatever uni-db currently depends on (see
# `../uni/Cargo.toml`).
uni-xervo = { version = "0.14.0", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
uuid = { version = "1", features = ["v7"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits (object-safe async fn in trait)
async-trait = "0.1"

# Random (retry jitter)
rand = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Observability
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Code parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# ML / embedding
ort = "2.0.0-rc.11"
tiktoken-rs = "0.6"
ndarray = "0.17"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# Python binding
pyo3 = { version = "0.23", features = ["extension-module"] }

# CLI
clap = { version = "4", features = ["derive"] }

# NLP evaluation
rust-stemmers = "1"

# Text processing
regex = "1"

# Caching
lru = "0.12"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Object storage (S3 / R2 / GCS / MinIO / in-memory for tests)
object_store = { version = "0.13", features = ["aws"] }

# Dev dependencies
proptest = "1"

# ── Dev profile: optimize inference-heavy deps so tests don't crawl ──
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
