[package]
name = "uniko-cuda"
description = "Python binding for uniko cognitive memory (ONNX + NVIDIA CUDA variant)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# GPU wheel variant of `uniko-py`. Reuses that crate's source and ships as the
# `uniko-cuda` maturin wheel (import path stays `uniko`); never a crates.io
# publish target.
publish = false

[lib]
name = "_uniko"
crate-type = ["cdylib"]
# One shared Rust source with the CPU binding; only the feature set differs.
path = "../uniko-py/src/lib.rs"

[dependencies]
# Same facade dep as uniko-py, plus the full CUDA stack. Forwards
# uniko-api -> uniko-memory -> uniko-store -> uni-db. `gpu-cuda` resolves to
# `ort/cuda` (ONNX Runtime CUDA EP, prebuilt sidecar via pyke). `candle` turns
# on uni-xervo's local-LLM provider; combined with `gpu-cuda`, uni-xervo's
# `candle-*?/cuda` forwards fire, so candle compiles CUDA kernels — this
# REQUIRES the CUDA toolkit (nvcc) at build time (see
# .github/workflows/release.yml `build-cuda-linux`, CUDA_COMPUTE_CAP=80).
uniko-api = { workspace = true, features = ["onnx", "gpu-cuda", "candle"] }
pyo3 = { workspace = true, features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
