[package]
name = "uniko-metal"
description = "Python binding for uniko cognitive memory (ONNX + Apple Metal/CoreML variant)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# GPU wheel variant of `uniko-py` (Apple Silicon). Reuses that crate's source
# and ships as the `uniko-metal` maturin wheel (import path stays `uniko`);
# never a crates.io publish target.
publish = false

[lib]
name = "_uniko"
crate-type = ["cdylib"]
# One shared Rust source with the CPU binding; only the feature set differs.
path = "../uniko-py/src/lib.rs"

[dependencies]
# Same facade dep as uniko-py, plus the full Metal stack. Forwards
# uniko-api -> uniko-memory -> uniko-store -> uni-db. `gpu-metal` resolves to
# `ort?/coreml` (ONNX Runtime CoreML EP; fires because the uni-db pin always
# enables `provider-onnx`). `candle` turns on uni-xervo's local-LLM provider;
# combined with `gpu-metal`, the `candle-*?/metal` forwards fire so candle
# compiles Metal kernels. macOS/Apple-Silicon only; the macOS runner's Metal
# SDK covers the toolchain (no extra install needed).
uniko-api = { workspace = true, features = ["onnx", "gpu-metal", "candle"] }
pyo3 = { workspace = true, features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
