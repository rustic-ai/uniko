[package]
name = "uniko-api"
description = "Public facade: builders, re-exports, no logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
uniko-cortex = { workspace = true }
uniko-memory = { workspace = true }

[features]
# Forward the ONNX content-extraction path (ort/tokenizers/ndarray) through the
# facade so downstream consumers — notably the `uniko-py` Python binding — can
# request it without naming the engine crates. Chains to
# `uniko-memory/onnx` -> `uniko-extract/onnx`. Note: the embedding/NLP runtime
# is already statically linked via uni-db's default `provider-onnx`; this only
# adds uniko-extract's own ort-backed extraction adapters.
onnx = ["uniko-memory/onnx"]
# Forward GPU acceleration through the facade to uni-db
# (uniko-memory -> uniko-store -> uni-db). Consumed by the `uniko-cuda` /
# `uniko-metal` wheel variants. `gpu-cuda` needs the CUDA toolkit at build
# time; `gpu-metal` is macOS-only.
gpu-cuda = ["uniko-memory/gpu-cuda"]
gpu-metal = ["uniko-memory/gpu-metal"]
# Forward the candle local-LLM provider through the facade to uni-db
# (uniko-memory -> uniko-store -> uni-db). Consumed by the `uniko-cuda` /
# `uniko-metal` wheel variants alongside `gpu-cuda`/`gpu-metal` so the GPU LLM
# kernels compile. `candle` on CUDA needs the CUDA toolkit (nvcc) at build time.
candle = ["uniko-memory/candle"]
