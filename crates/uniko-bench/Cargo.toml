[package]
name = "uniko-bench"
description = "LoCoMo benchmark harness for uniko cognitive memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Internal benchmark harness — not published to crates.io.
publish = false

[[bin]]
name = "uniko-bench"
path = "src/main.rs"

[[bin]]
name = "longmemeval-bench"
path = "src/longmemeval_main.rs"

[[bin]]
name = "uniko-cypher"
path = "src/cypher_main.rs"

# Regenerates the tracked `config/schema.json`. A binary rather than a test:
# its product is a side effect on a tracked file, so no test-selection flag
# should be able to trigger it.
[[bin]]
name = "export-schema"
path = "src/export_schema_main.rs"

[[bin]]
name = "nlp-compare"
path = "src/nlp_compare_main.rs"

[[bin]]
name = "profile-writes"
path = "src/profile_writes_main.rs"

[[bin]]
name = "insert-microbench"
path = "src/insert_microbench_main.rs"

[[bin]]
name = "update-microbench"
path = "src/update_microbench_main.rs"

[[bin]]
name = "mutation-set-microbench"
path = "src/mutation_set_microbench_main.rs"

[[bin]]
name = "bulk-vs-unwind"
path = "src/bulk_vs_unwind_main.rs"

[[bin]]
name = "nlp-parity"
path = "src/nlp_parity_main.rs"

[features]
# CPU by default so the standard workspace commands — `cargo check/clippy/
# nextest --workspace`, used by CI and contributors — build without a CUDA
# toolkit. A `gpu-cuda` default forces `nvcc` at build time (via
# mistralrs-quant), which CUDA-less machines (CI, Macs, most laptops) don't
# have, so the whole `--workspace` build fails. GPU is opt-in: pass
# `--features gpu-cuda` (the bench's `run.sh` does this) or, on Mac,
# `--features gpu-metal`.
default = []
gpu-cuda = ["uniko-store/gpu-cuda"]
gpu-metal = ["uniko-store/gpu-metal"]

[dependencies]
uniko-memory = { workspace = true, features = ["onnx"] }
uniko-extract = { workspace = true, features = ["onnx"] }
uniko-cortex = { workspace = true }
uniko-pipes = { workspace = true }
uniko-store = { workspace = true, features = ["batch-record"] }
uni-db = { workspace = true }
# Direct dep so the nlp-parity bin can name xervo's `NlpModel` trait and
# `NlpRequest`/`NlpTasks` types (uni-db does not re-export them).
uni-xervo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rust-stemmers = { workspace = true }
regex = { workspace = true }
tempfile = "3"
