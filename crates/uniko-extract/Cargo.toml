[package]
name = "uniko-extract"
description = "Layer 3: Content processing — NER, observations, chunking, ingest, embedding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
uniko-pipes = { workspace = true }
uniko-store = { workspace = true }
uni-db = { workspace = true }
# Direct dep so the NLP adapter can name xervo's `NlpModel` / `NlpRequest`
# / `NlpResult` (uni-db does not re-export them).
uni-xervo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tiktoken-rs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
dom_smoothie = "0.18"
csv = "1.4"
pdf-extract = "0.10"
thiserror = { workspace = true }

# Optional dependencies for feature-gated functionality
tree-sitter = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
tokio-util = { workspace = true }

[features]
default = ["code-parse"]
onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
code-parse = [
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
]
