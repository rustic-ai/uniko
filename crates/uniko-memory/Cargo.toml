[package]
name = "uniko-memory"
description = "Layer 4: Memory management — pipelines, recall cascade, rules, consolidation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
uniko-cortex = { workspace = true }
uniko-extract = { workspace = true }
uniko-pipes = { workspace = true }
uniko-store = { workspace = true }
uni-db = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
lru = { workspace = true }

[dev-dependencies]
# Persistent stores for the crash/reopen acceptance test (issue #40).
tempfile = "3"

[features]
onnx = ["uniko-extract/onnx"]
# Enable the abstractive (LLM-rewritten) path for F59 summaries. When
# absent, summary generation stays deterministic/extractive and offline.
llm = ["uniko-cortex/llm"]
# GPU passthrough to uniko-store -> uni-db (terminates at uniko-store, the sole
# uni-db boundary). Enabled by the uniko-cuda / uniko-metal wheel variants.
gpu-cuda = ["uniko-store/gpu-cuda"]
gpu-metal = ["uniko-store/gpu-metal"]
# Local-LLM provider passthrough to uniko-store -> uni-db. Enabled by the
# uniko-cuda / uniko-metal wheel variants (GPU LLM inference via mistralrs+candle).
mistralrs = ["uniko-store/mistralrs"]
candle = ["uniko-store/candle"]
