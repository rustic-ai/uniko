[package]
name = "uniko-store"
description = "Layer 1: Graph storage, search, and Locy runtime for uniko"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enable NVIDIA CUDA acceleration in uni-db (requires CUDA toolkit at build time).
gpu-cuda = ["uni-db/gpu-cuda"]
# Enable Apple Metal/CoreML acceleration in uni-db (macOS only).
gpu-metal = ["uni-db/gpu-metal"]
# Compile uni-xervo's native candle provider in uni-db. candle-core/-nn/
# -transformers come in with it, so this adds only
# xervo's candle glue (no duplicate candle crates). GPU kernels ride the same
# `gpu-cuda`/`gpu-metal` `candle-*?/cuda|metal` forwards.
candle = ["uni-db/provider-candle"]
# Diagnostic-only: capture bulk-write batches in a process-global buffer
# so benchmarks can replay them (see `storage::batch_record`). Compiles
# the recording hooks to no-ops when absent; never enable in production.
batch-record = []

[dependencies]
uni-db = { workspace = true }
uni-xervo = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
