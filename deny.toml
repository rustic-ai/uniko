# cargo-deny configuration (schema for cargo-deny >= 0.18).
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Limit "unmaintained" checks to first-party/workspace deps to avoid noise
# from transitive crates we don't control. Security vulnerabilities and yanked
# crates are still flagged across the whole graph.
unmaintained = "workspace"
yanked = "deny"
# Transitive advisories accepted for now. None are in uniko's own code;
# revisit each as upstreams publish fixes. See SECURITY.md.
#
# Entries here are pruned when they stop matching: cargo-deny reports an
# unmatched ignore as `advisory-not-detected`, and a dead entry would silently
# swallow the advisory if it ever came back. Nine have been removed once their
# upstreams shipped fixes: two rustls/TLS-stack, two pyo3, three zstd/zstd-safe
# (backported into 0.13.4 / 7.4.0), four `zip` (uni-xervo 0.19 moved to
# candle 0.11, which requires zip 9) and one `lopdf` (pdf-extract 0.12 moved to
# lopdf 0.42).
ignore = [
    "RUSTSEC-2023-0071", # `rsa` Marvin timing side-channel — no fixed upstream release; transitive via reqsign-azure-storage -> opendal-service-azblob -> opendal -> lance-io (uni-db's Lance stack).
    "RUSTSEC-2026-0194", # `quick-xml` quadratic dup-attribute scan (DoS) — transitive via object_store 0.13 (datafusion/lance); that pin holds quick-xml 0.39.4 while the fix is 0.41, which the graph already carries for other consumers; unblock when datafusion/lance move to object_store 0.14.
    "RUSTSEC-2026-0195", # `quick-xml` unbounded namespace alloc in NsReader (DoS) — same object_store 0.13 pin as RUSTSEC-2026-0194.
]

[licenses]
# Permissive licenses compatible with Apache-2.0 distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Duplicate transitive versions are inherited from the ML/data-store stack and
# cannot be collapsed from uniko: `cargo update` already resolves every crate to
# its newest semver-compatible release, and the duplicates are semver-INcompatible
# majors pulled by different upstreams (e.g. base64 0.13 via tokenizers'
# spm_precompiled vs 0.22 via arrow). We skip the roots of that inherited graph
# by subtree so `multiple-versions` still flags any NEW duplicate uniko itself
# introduces outside these trees. Revisit as the upstreams converge.
skip-tree = [
    { crate = "uni-db" },        # lance / datafusion / arrow + uni-xervo (mistralrs, candle, tokenizers)
    { crate = "uni-xervo" },     # local-LLM + candle + tokenizers stack
    { crate = "uni-xervo-pdf" }, # hayro PDF rasterizer + OCR stack
    { crate = "pdf-extract" },   # lopdf PDF text extraction
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
