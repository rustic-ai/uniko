[project]
name = "uniko-docs"
version = "0.1.0"
description = "Documentation site for uniko — a cognitive memory system for AI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai" },
]
dependencies = [
    "zensical>=0.0.45,<0.1",
    "pymdown-extensions>=11.0,<12",
]

[project.urls]
Homepage = "https://www.rustic.ai"
Repository = "https://github.com/rustic-ai/uniko"

[tool.uv]
# Documentation environment, not an installable package (mirrors the former
# poetry `package-mode = false`).
package = false
